name: Build Internal QA Debug APK (Manual Only - Non-Production)

# Manual workflow_dispatch ONLY: builds an explicitly debug-signed internal QA APK artifact
# for testing when production release keystore secrets are not yet configured.
# Never triggers automatically on push and never publishes a GitHub Release.
on:
  workflow_dispatch:

jobs:
  qa-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: campusride-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: campusride-mobile
        run: npm ci

      - name: Prebuild Android project
        working-directory: campusride-mobile
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle JVM
        working-directory: campusride-mobile/android
        run: |
          echo "org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: Build Debug QA APK (Non-Production)
        working-directory: campusride-mobile/android
        run: ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: Upload Internal QA Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusride-hogo-qa-debug-non-production
          path: campusride-mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
