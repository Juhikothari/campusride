name: Backend & Mobile Verification CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Backend Security & Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Security & Chatbot Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/campusride-test
          JWT_SECRET: test_jwt_secret_must_be_sufficiently_long_for_security_tests_12345
        run: npm test

  mobile-checks:
    name: Verify Mobile Code (Expo Doctor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: campusride-mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./campusride-mobile
        run: npm ci

      - name: Lint and Verify Mobile Code (Expo Doctor)
        working-directory: ./campusride-mobile
        run: npx expo-doctor
