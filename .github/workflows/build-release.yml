name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Backend Security & Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Security Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/campusride-test
          JWT_SECRET: test_jwt_secret_must_be_sufficiently_long_for_security_tests_12345
        run: npm test

  build:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: campusride-mobile/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install Mobile Dependencies
        working-directory: ./campusride-mobile
        run: npm ci

      - name: Lint and Verify Mobile Code (Expo Doctor)
        working-directory: ./campusride-mobile
        run: npx expo-doctor

      - name: Build Standalone Android APK (EAS Build)
        working-directory: ./campusride-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://campusride-backend-gwgr.onrender.com' }}
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --local

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            campusride-mobile/*.apk
            campusride-mobile/*.aab
          if-no-files-found: error
