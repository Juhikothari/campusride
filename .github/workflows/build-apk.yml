name: Build Android APK (Free Unlimited)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: campusride-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: campusride-mobile
        run: npm ci

      - name: Prebuild Android project
        working-directory: campusride-mobile
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle & Sign Release APK
        working-directory: campusride-mobile/android
        run: |
          echo "org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          python3 -c "
          p = 'app/build.gradle'
          with open(p, 'r') as f: content = f.read()
          content = content.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }')
          with open(p, 'w') as f: f.write(content)
          " || true

      - name: Build Android APK
        working-directory: campusride-mobile/android
        run: ./gradlew assembleRelease --no-daemon -x lint -x test || ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusride-hogo-app
          path: campusride-mobile/android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HOGO App APK (Build #${{ github.run_number }})"
          body: |
            ### 🚀 HOGO CampusRide Android APK (Build #${{ github.run_number }})
            Download the APK below and install it directly on your Android phone.
          draft: false
          prerelease: false
          make_latest: true
          files: campusride-mobile/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
